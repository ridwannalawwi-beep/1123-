<script>
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('brand-logo');
            const subtext = document.getElementById('brand-subtext');
            const chainContainer = document.getElementById('chain-mask-container');
            const percentCounter = document.getElementById('percent-counter');
            const statusText = document.getElementById('status-text');

            const statuses = [
                "CALIBRATING CHASSIS...",
                "SYNCING ECU...",
                "POLISHING TITANIUM...",
                "TESTING TORQUE...",
                "OPTIMIZING COMBUSTION...",
                "READY TO RIDE"
            ];

            // Initial animations
            setTimeout(() => {
                logo.style.opacity = '1';
                logo.style.transform = 'translateY(0)';
            }, 300);

            setTimeout(() => {
                subtext.style.opacity = '1';
                subtext.style.transform = 'translateY(0)';
            }, 600);

            // Progress Bar Logic
            let progress = 0;
            const duration = 3500; // Adjusted to ~3.5 seconds for redirect around 4s
            const interval = 50;
            const step = (100 / (duration / interval));

            const updateLoading = setInterval(() => {
                // Add some slight randomness to the step for a more "organic" loading feel
                progress += step + (Math.random() * 1.2);
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(updateLoading);
                    completeLoading();
                }

                chainContainer.style.setProperty('--progress', `${progress}%`);
                percentCounter.textContent = Math.floor(progress).toString().padStart(2, '0');
                
                // Update status text based on progress
                const statusIndex = Math.min(Math.floor((progress / 100) * statuses.length), statuses.length - 1);
                statusText.textContent = statuses[statusIndex];

            }, interval);

            function completeLoading() {
                statusText.classList.add('text-primary');
                statusText.textContent = "SYSTEMS ONLINE";
                
                // Final interaction trigger after a small delay
                setTimeout(() => {
                    document.body.style.transition = 'opacity 0.6s ease-out';
                    document.body.style.opacity = '0';
                    
                    // Automatically redirect to Home page (SCREEN_15)
                    setTimeout(() => {
                        window.location.href = 'home page.html';
                    }, 600);
                }, 800);
            }
        });
    </script>
